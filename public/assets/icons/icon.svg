<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000000"/>
  <!-- Outer convergence ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="0.6"/>
  <!-- Perfect-window hint ring -->
  <circle cx="256" cy="256" r="76" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25"/>
  <!-- Target orb stroke -->
  <circle cx="256" cy="256" r="56" fill="none" stroke="#ffffff" stroke-width="10"/>
  <!-- Orb fill -->
  <circle cx="256" cy="256" r="20" fill="#ffffff"/>
</svg>
