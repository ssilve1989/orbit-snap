<!DOCTYPE html>
<html lang="en">
<head>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: Does the ring-convergence tap mechanic feel satisfying and readable across themed space backgrounds? -->
<!-- Date: 2026-03-29 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring Tap — Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: monospace; color: white; user-select: none; }
  canvas { position: fixed; top: 0; left: 0; cursor: pointer; display: block; }
  #ui {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; min-width: 220px; z-index: 10;
  }
  #score    { font-size: 22px; letter-spacing: 2px; }
  #feedback { font-size: 36px; font-weight: bold; height: 44px; letter-spacing: 3px; transition: opacity 0.25s; }
  #combo      { font-size: 16px; color: #aaa; height: 22px; }
  #difficulty { font-size: 13px; color: #666; margin-top: 2px; }
  #bg-controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 10;
  }
  #instructions { font-size: 13px; color: #444; letter-spacing: 1px; }
  #bg-switcher  { display: flex; align-items: center; gap: 14px; }
  #bg-switcher button {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.6); font-family: monospace; font-size: 14px;
    padding: 5px 13px; cursor: pointer;
  }
  #bg-switcher button:hover { background: rgba(255,255,255,0.14); color: white; }
  #bg-label { font-size: 12px; letter-spacing: 3px; color: rgba(255,255,255,0.45); min-width: 150px; text-align: center; }
</style>
</head>
<body>

<div id="ui">
  <div id="score">SCORE: 0</div>
  <div id="feedback"></div>
  <div id="combo"></div>
  <div id="difficulty">LEVEL 1</div>
</div>

<div id="bg-controls">
  <div id="instructions">CLICK or SPACE — tap when the ring meets the orb</div>
  <div id="bg-switcher">
    <button id="bg-prev">◀</button>
    <span id="bg-label"></span>
    <button id="bg-next">▶</button>
  </div>
</div>

<script type="module">
import * as PIXI from 'https://cdn.jsdelivr.net/npm/pixi.js@8.17.1/dist/pixi.min.mjs';

// PROTOTYPE - NOT FOR PRODUCTION
// Question: Does the ring-convergence tap mechanic feel satisfying and readable across themed space backgrounds?
// Date: 2026-03-29

(async () => {

// ─── PixiJS Application ───────────────────────────────────────────────────────
const app = new PIXI.Application();
await app.init({
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: 0x000000,
  antialias: false,
  powerPreference: 'high-performance',
});
document.body.insertBefore(app.canvas, document.body.firstChild);
Object.assign(app.canvas.style, { position: 'fixed', top: '0', left: '0', cursor: 'pointer', display: 'block' });
const W = app.screen.width, H = app.screen.height;
const CX = W / 2, CY = H / 2;
const D = Math.hypot(W, H), AR = W / H;

// ─── Tuning knobs ─────────────────────────────────────────────────────────────
const ORB_RADIUS        = 32;
const RING_MAX_RADIUS   = 265;
const RING_SPEED        = 115;
const PERFECT_WINDOW    = 9;
const GOOD_WINDOW       = 22;
const STAGGER_MS        = 550;
const DIFFICULTY_LEVELS = [1, 1, 1, 2, 2, 3];
const ROUNDS_PER_LEVEL  = 4;

// ─── Default vertex shader (PixiJS v8) ───────────────────────────────────────
const DEFAULT_VERT = `
attribute vec2 aPosition;
varying vec2 vTextureCoord;
uniform vec4 uInputSize;
uniform vec4 uOutputFrame;
uniform vec4 uOutputTexture;

vec4 filterVertexPosition(void) {
    vec2 position = aPosition * uOutputFrame.zw + uOutputFrame.xy;
    position.x = position.x * (2.0 / uOutputTexture.x) - 1.0;
    position.y = position.y * (2.0 * uOutputTexture.z / uOutputTexture.y) - uOutputTexture.z;
    return vec4(position, 0.0, 1.0);
}
vec2 filterTextureCoord(void) {
    return aPosition * (uOutputFrame.zw * uInputSize.zw);
}
void main(void) {
    gl_Position = filterVertexPosition();
    vTextureCoord = filterTextureCoord();
}`;

// ─── GLSL shared code ─────────────────────────────────────────────────────────
const GLSL_HEADER = `
precision highp float;
varying vec2 vTextureCoord;
uniform float uTime;
uniform float uAspectRatio;
uniform vec4 uInputSize;
uniform vec4 uOutputFrame;
`;

const GLSL_NOISE = `
float hash21(vec2 p) { return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
vec2 hash22(vec2 p) { p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))); return fract(sin(p)*43758.5453); }
float vnoise(vec2 p) {
    vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);
}
float fbm(vec2 p) {
    float v=0.0,a=0.5;
    for(int i=0;i<5;i++){v+=a*vnoise(p);p=p*2.1+vec2(1.7,9.2);a*=0.48;}
    return v;
}
`;

const GLSL_STARS = `
vec3 starField(vec2 uv, float density, float brightness) {
    vec3 col=vec3(0.0);
    for(int i=0;i<4;i++){
        float sc=60.0+float(i)*110.0;
        vec2 gv=uv*sc, id=floor(gv), gf=fract(gv);
        if(hash21(id+float(i)*13.7)>density) continue;
        vec2 sp=hash22(id+float(i)*0.4)*0.9+0.05;
        float d=length(gf-sp);
        float br=pow(hash21(id+float(i)*2.3),2.5);
        float temp=hash21(id+float(i)*3.1);
        float sz=0.006+br*0.01;
        float glow=exp(-d*d/(sz*sz*3.0));
        float core=exp(-d*d/(sz*sz*0.3))*0.8;
        float twinkle=0.82+0.18*sin(uTime*(1.5+br*3.0)+hash21(id)*6.28);
        vec3 sc2=mix(vec3(1.0,0.55,0.2),mix(vec3(1.0,1.0,0.95),vec3(0.6,0.8,1.0),temp),clamp(temp*1.4,0.0,1.0));
        col+=(glow+core)*br*brightness*sc2*twinkle;
    }
    return col;
}
`;

const GLSL_COMMON = GLSL_HEADER + GLSL_NOISE + GLSL_STARS;

// ─── Helper: fullscreen filter sprite ────────────────────────────────────────
function makeFullscreenSprite(frag, extraUniforms = {}) {
  const uniformDefs = {
    uTime: { value: 0.0, type: 'f32' },
    uAspectRatio: { value: AR, type: 'f32' },
  };
  for (const [k, v] of Object.entries(extraUniforms)) {
    uniformDefs[k] = { value: v, type: 'f32' };
  }
  const f = new PIXI.Filter({
    glProgram: new PIXI.GlProgram({ vertex: DEFAULT_VERT, fragment: frag }),
    resources: { globals: uniformDefs },
  });
  f.padding = 0;
  const s = new PIXI.Sprite(PIXI.Texture.WHITE);
  s.width = W; s.height = H; s.filters = [f];
  return { sprite: s, filter: f };
}

// ─── Background stage ─────────────────────────────────────────────────────────
const bgStage = new PIXI.Container();
app.stage.addChild(bgStage);

// Populated in order by each background IIFE below
const BACKGROUNDS = [];

// ─── Background 1: DEEP SPACE ─────────────────────────────────────────────────
const FRAG_DEEP_SPACE = GLSL_COMMON + `
void main() {
    vec2 uv = vTextureCoord * uInputSize.xy / uOutputFrame.zw;
    vec3 col = vec3(0.02, 0.025, 0.065);

    // Milky Way band — dense star region along a diagonal
    float band = exp(-pow(uv.y - uv.x * 0.5 - 0.25, 2.0) * 12.0);
    col += starField(uv + vec2(0.37, 0.81), 0.72, 1.8) * (1.0 + band * 1.2);
    col += starField(uv, 0.55, 1.0);

    // Galaxy smear
    vec2 gp = (uv - vec2(0.28, 0.69)) * vec2(uAspectRatio, 1.0);
    float gal = exp(-dot(gp, gp) * 10.0);
    col += gal * vec3(0.4, 0.45, 1.0) * 0.10;

    gl_FragColor = vec4(col, 1.0);
}
`;

(function buildDeepSpace() {
  const container = new PIXI.Container();
  const { sprite, filter } = makeFullscreenSprite(FRAG_DEEP_SPACE, {});
  container.addChild(sprite);
  bgStage.addChild(container);
  BACKGROUNDS.push({
    name: 'DEEP SPACE',
    container,
    update(ts) { filter.resources.globals.uniforms.uTime = ts * 0.001; },
  });
})();

// ─── Background 2: NEBULA ─────────────────────────────────────────────────────
const FRAG_NEBULA = GLSL_COMMON + `
void main() {
    vec2 uv = vTextureCoord * uInputSize.xy / uOutputFrame.zw;

    // Two rounds of FBM domain warping (reduced scale for calmer motion)
    vec2 q = vec2(fbm(uv * 2.5 + uTime * 0.010),
                  fbm(uv * 2.5 + vec2(5.2, 1.3) + uTime * 0.008));
    vec2 r = vec2(fbm(uv * 2.5 + 3.0 * q + vec2(1.7, 9.2) + uTime * 0.006),
                  fbm(uv * 2.5 + 3.0 * q + vec2(8.3, 2.8) + uTime * 0.005));
    float f = fbm(uv * 2.0 + 3.0 * r + uTime * 0.004);

    // Sharpen contrast: only bright peaks become cloud, rest stays dark
    f = smoothstep(0.42, 0.78, f);

    // Color: mostly void, sparse wisps, rare bright filaments
    vec3 col = mix(vec3(0.01, 0.005, 0.025),
               mix(vec3(0.20, 0.03, 0.32),
               mix(vec3(0.06, 0.04, 0.58),
                   vec3(0.80, 0.85, 1.0),
               smoothstep(0.6, 0.9, f)),
               smoothstep(0.3, 0.62, f)),
               smoothstep(0.0, 0.42, f));

    // Dust lanes
    float dust = fbm(uv * 4.0 + vec2(3.0, 7.0));
    col *= 0.68 + 0.32 * (1.0 - smoothstep(0.45, 0.55, dust));

    col += starField(uv, 0.52, 0.85);

    gl_FragColor = vec4(col, 1.0);
}
`;

(function buildNebula() {
  const container = new PIXI.Container();
  const { sprite, filter } = makeFullscreenSprite(FRAG_NEBULA, {});
  container.addChild(sprite);
  bgStage.addChild(container);
  BACKGROUNDS.push({
    name: 'NEBULA',
    container,
    update(ts) { filter.resources.globals.uniforms.uTime = ts * 0.001; },
  });
})();

// ─── Background 3: PULSAR ZONE ────────────────────────────────────────────────
const FRAG_PULSAR = GLSL_COMMON + `
uniform float uPulse;
void main() {
    vec2 uv = vTextureCoord * uInputSize.xy / uOutputFrame.zw;
    vec2 d = uv - vec2(0.5);
    d.x *= uAspectRatio;
    float dist = length(d);
    float phi = atan(d.y, d.x);

    vec3 col = vec3(0.005, 0.025, 0.030);
    col += starField(uv, 0.38, 0.28);

    // Rotating emission beams (computed in shader — avoids Canvas blur overflow)
    float beamAngle = uTime * 0.45;
    for (int i = 0; i < 2; i++) {
        float ba = beamAngle + float(i) * 3.14159265;
        float da = phi - ba;
        // Wrap to [-pi, pi]
        da = da - 6.28318530 * floor((da + 3.14159265) / 6.28318530);
        float falloff = 1.0 / max(dist * 2.2 + 0.18, 0.18);
        float bloom = exp(-da * da * 5.0) * 0.20 * falloff;
        float sharp = exp(-da * da * 90.0) * 0.65 * falloff;
        float pulse = 0.55 + uPulse * 0.45;
        col += vec3(0.05, 0.50, 1.0) * bloom * pulse;
        col += vec3(0.55, 0.85, 1.0) * sharp * pulse;
    }

    // Central core glow
    float core = exp(-dist * dist * 60.0);
    col += vec3(0.3, 0.8, 1.0) * core * (0.6 + uPulse * 0.4);

    // Outer halo
    float halo = exp(-dist * dist * 4.0) * 0.12;
    col += vec3(0.1, 0.45, 0.7) * halo;

    // Faint magnetosphere rings
    float ringMask = exp(-pow(dist - 0.22, 2.0) * 180.0);
    float rings = sin(dist * 80.0 - uTime * 2.0) * 0.5 + 0.5;
    col += vec3(0.1, 0.6, 1.0) * rings * ringMask * 0.18 * uPulse;

    gl_FragColor = vec4(col, 1.0);
}
`;

(function buildPulsar() {
  const container = new PIXI.Container();
  const { sprite, filter } = makeFullscreenSprite(FRAG_PULSAR, { uPulse: 0.5 });
  container.addChild(sprite);
  bgStage.addChild(container);
  BACKGROUNDS.push({
    name: 'PULSAR ZONE',
    container,
    update(ts) {
      const t = ts * 0.001;
      filter.resources.globals.uniforms.uTime = t;
      filter.resources.globals.uniforms.uPulse = 0.5 + 0.5 * Math.sin(t * 3.0);
    },
  });
})();

// ─── Background 4: RED GIANT ──────────────────────────────────────────────────
const FRAG_RED_GIANT = GLSL_COMMON + `
void main() {
    vec2 uv = vTextureCoord * uInputSize.xy / uOutputFrame.zw;
    vec2 starPos = vec2(0.84, 0.10);
    vec2 d = uv - starPos;
    d.x *= uAspectRatio;
    float dist = length(d);
    // Use normalized direction components instead of atan — avoids the
    // ±π wrap discontinuity that draws a hard horizontal seam leftward
    // from the star across the screen.
    vec2 dir = d / (dist + 0.001);

    vec3 col = vec3(0.05, 0.015, 0.004);

    // Wide warm glow across scene
    float warmGlow = exp(-dist * dist * 1.2);
    col += vec3(0.55, 0.12, 0.02) * warmGlow * 0.45;

    // FBM corona ring — dir.x/dir.y are continuous, no seam
    float corona = fbm(vec2(dir.x * 2.2 + dir.y * 0.7 + uTime * 0.03, dist * 6.0 - uTime * 0.1));
    float coronaRing = exp(-pow(dist - 0.18, 2.0) * 40.0) * corona;
    col += vec3(1.0, 0.45, 0.05) * coronaRing * 1.4;

    // Star surface
    float surface = smoothstep(0.18, 0.0, dist);
    col += surface * vec3(1.0, 0.85, 0.4) * 12.0;

    // Solar prominences
    float promMask = smoothstep(0.35, 0.12, dist) * smoothstep(0.04, 0.18, dist);
    float prom = fbm(vec2(dir.x * 3.0 + dir.y * 1.1 + uTime * 0.06, dist * 8.0 - uTime * 0.15));
    col += vec3(1.0, 0.35, 0.05) * prom * promMask * 0.6;

    col += starField(uv, 0.42, 0.35);

    gl_FragColor = vec4(col, 1.0);
}
`;

(function buildRedGiant() {
  const container = new PIXI.Container();
  const { sprite, filter } = makeFullscreenSprite(FRAG_RED_GIANT, {});
  container.addChild(sprite);
  bgStage.addChild(container);
  BACKGROUNDS.push({
    name: 'RED GIANT',
    container,
    update(ts) { filter.resources.globals.uniforms.uTime = ts * 0.001; },
  });
})();

// ─── Background 5: EVENT HORIZON ──────────────────────────────────────────────
const FRAG_EVENT_HORIZON = GLSL_COMMON + `
void main() {
    vec2 uv = vTextureCoord * uInputSize.xy / uOutputFrame.zw;
    vec2 d = uv - vec2(0.5);
    float r = length(d * vec2(uAspectRatio, 1.0));
    float rs = 0.08;

    // Gravitational lensing
    float lensStr = rs * rs / (r * r + 0.001);
    vec2 lensedUV = uv + normalize(d + vec2(0.0001)) * lensStr * 0.35;

    vec3 col = vec3(0.0);

    // Stars with lensing outside the Schwarzschild radius
    if (r > rs) {
        col += starField(lensedUV, 0.55, 0.55);
    }

    // Accretion disk — kept dim so game elements stay readable
    vec2 diskD = d * vec2(1.5 * uAspectRatio, 0.28);
    float diskDist = length(diskD);
    float diskBright = exp(-pow(diskDist - 0.09, 2.0) * 320.0);
    float diskBright2 = exp(-pow(diskDist - 0.15, 2.0) * 180.0);
    float diskBright3 = exp(-pow(diskDist - 0.22, 2.0) * 90.0);
    float doppler = d.x * uAspectRatio / (diskDist + 0.001) * 0.5 + 0.5;
    vec3 diskColor = mix(vec3(0.2, 0.4, 1.0), vec3(1.0, 0.55, 0.1), doppler);
    col += diskColor * (diskBright * 0.55 + diskBright2 * 0.28 + diskBright3 * 0.12);

    // Photon ring — subtle
    float photonR = rs * 1.5;
    float photonGlow = exp(-pow(r - photonR, 2.0) * 1800.0);
    col += vec3(0.9, 0.75, 1.0) * photonGlow * 0.65;

    // Event horizon shadow
    float shadow = smoothstep(rs * 0.9, rs, r);
    col *= shadow;

    // Strong vignette — keeps center clear for gameplay
    float vignette = 1.0 - smoothstep(0.18, 0.52, length(d));
    col *= vignette * vignette;

    gl_FragColor = vec4(col, 1.0);
}
`;

(function buildEventHorizon() {
  const container = new PIXI.Container();
  const { sprite, filter } = makeFullscreenSprite(FRAG_EVENT_HORIZON, {});
  container.addChild(sprite);
  bgStage.addChild(container);
  BACKGROUNDS.push({
    name: 'EVENT HORIZON',
    container,
    update(ts) { filter.resources.globals.uniforms.uTime = ts * 0.001; },
  });
})();

// ─── Background preview override ─────────────────────────────────────────────
let previewBgIdx = null;

function getActiveBgIdx() {
  return previewBgIdx !== null ? previewBgIdx : diffLevel % BACKGROUNDS.length;
}

function getBg() {
  return BACKGROUNDS[getActiveBgIdx()];
}

function setActiveBg(idx) {
  for (let i = 0; i < BACKGROUNDS.length; i++) {
    BACKGROUNDS[i].container.visible = (i === idx);
  }
  document.getElementById('bg-label').textContent = BACKGROUNDS[idx].name;
}

function cycleBg(dir) {
  const current = getActiveBgIdx();
  previewBgIdx = (current + dir + BACKGROUNDS.length) % BACKGROUNDS.length;
  setActiveBg(previewBgIdx);
}

document.getElementById('bg-prev').addEventListener('click', () => cycleBg(-1));
document.getElementById('bg-next').addEventListener('click', () => cycleBg(+1));

// ─── Game state ───────────────────────────────────────────────────────────────
let rings        = [];
let score        = 0;
let combo        = 0;
let maxCombo     = 0;
let roundsPlayed = 0;
let diffLevel    = 0;

let lastFeedback   = '';
let feedbackTimer  = 0;
let feedbackColor  = '#fff';
let orbFlash       = 0;
let orbFlashColor  = '#fff';
let waitingForNext = false;
let waitTimer      = 0;

// ─── Round management ─────────────────────────────────────────────────────────

function currentRingCount() {
  return DIFFICULTY_LEVELS[diffLevel % DIFFICULTY_LEVELS.length];
}

function spawnRound() {
  const count = currentRingCount();
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      rings.push({ radius: RING_MAX_RADIUS, hit: false, missed: false, alpha: 1 });
    }, i * STAGGER_MS);
  }
}

// ─── Hit detection ────────────────────────────────────────────────────────────

function tap() {
  let bestIdx = -1, bestDelta = Infinity;
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i];
    if (r.hit || r.missed) continue;
    const delta = Math.abs(r.radius - ORB_RADIUS);
    if (delta < bestDelta) { bestDelta = delta; bestIdx = i; }
  }
  if (bestIdx === -1) return;

  const grade = bestDelta <= PERFECT_WINDOW ? 'PERFECT'
              : bestDelta <= GOOD_WINDOW    ? 'GOOD'
              : 'MISS';
  resolveRing(bestIdx, grade);
}

function resolveRing(idx, grade) {
  rings[idx].hit = true;
  if (grade === 'PERFECT') { score += 100 * (1 + Math.floor(combo / 5)); combo++; feedbackColor = '#00ffcc'; }
  else if (grade === 'GOOD') { score += 50; combo++; feedbackColor = '#88ff44'; }
  else { combo = 0; feedbackColor = '#ff4444'; }
  maxCombo = Math.max(maxCombo, combo);
  orbFlashColor = feedbackColor;
  orbFlash = 280; lastFeedback = grade; feedbackTimer = 700;
  refreshUI();
}

function autoMiss(idx) {
  rings[idx].missed = true;
  combo = 0; orbFlashColor = '#ff2222'; orbFlash = 280;
  lastFeedback = 'MISS'; feedbackTimer = 700; feedbackColor = '#ff4444';
  refreshUI();
}

// ─── UI ───────────────────────────────────────────────────────────────────────

function refreshUI() {
  document.getElementById('score').textContent = `SCORE: ${score}`;
  const fb = document.getElementById('feedback');
  fb.textContent = lastFeedback; fb.style.color = feedbackColor; fb.style.opacity = '1';
  document.getElementById('combo').textContent = combo > 1 ? `${combo}× COMBO` : '';
  document.getElementById('difficulty').textContent =
    `LEVEL ${diffLevel + 1}  ·  ${currentRingCount()} RING${currentRingCount() > 1 ? 'S' : ''}`;
  document.getElementById('bg-label').textContent = getBg().name;
}

// ─── Game rendering (PixiJS Graphics, redrawn each tick) ─────────────────────
const gameGraphics = new PIXI.Graphics();
app.stage.addChild(gameGraphics);

function drawGame() {
  gameGraphics.clear();

  // Hint rings
  gameGraphics.circle(CX, CY, ORB_RADIUS + GOOD_WINDOW).stroke({ width: 1, color: 0xffffff, alpha: 0.045 });
  gameGraphics.circle(CX, CY, ORB_RADIUS + PERFECT_WINDOW).stroke({ width: 1, color: 0xffffff, alpha: 0.09 });

  // Converging rings
  for (const r of rings) {
    if (r.radius <= 0) continue;
    let hexColor, alpha;
    if (r.hit) {
      hexColor = 0x00ffc8; alpha = r.alpha * 0.55;
    } else if (r.missed) {
      hexColor = 0xff3c3c; alpha = r.alpha * 0.55;
    } else {
      const t = 1 - Math.max(0, (r.radius - ORB_RADIUS) / (RING_MAX_RADIUS - ORB_RADIUS));
      hexColor = (255 << 16) | (Math.round(255 * (1 - t * 0.55)) << 8) | Math.round(255 * (1 - t));
      alpha = r.alpha;
    }
    gameGraphics.circle(CX, CY, r.radius).stroke({ width: 4, color: hexColor, alpha });
  }

  // Orb
  const flashing = orbFlash > 0;
  const orbHex = flashing ? parseInt(orbFlashColor.replace('#', ''), 16) : 0xffffff;
  const orbAlpha = flashing ? 0.35 + 0.65 * Math.min(1, orbFlash / 140) : 0.85;
  if (flashing) {
    gameGraphics.circle(CX, CY, ORB_RADIUS).fill({ color: orbHex, alpha: 0.14 });
  }
  gameGraphics.circle(CX, CY, ORB_RADIUS).stroke({ width: 4, color: orbHex, alpha: orbAlpha });
}

// ─── Input ────────────────────────────────────────────────────────────────────
app.canvas.addEventListener('click', tap);
document.addEventListener('keydown', e => {
  if (e.code === 'Space')      { e.preventDefault(); tap(); }
  if (e.code === 'ArrowLeft')  cycleBg(-1);
  if (e.code === 'ArrowRight') cycleBg(+1);
});

// ─── Ticker (replaces requestAnimationFrame loop) ─────────────────────────────
app.ticker.add(() => {
  const ts = performance.now();
  const dt = app.ticker.deltaMS / 1000;

  // Update active background shader
  BACKGROUNDS[getActiveBgIdx()].update(ts);

  // Shrink rings, detect auto-miss
  for (let i = 0; i < rings.length; i++) {
    const r = rings[i];
    if (!r.hit && !r.missed) {
      r.radius -= RING_SPEED * dt;
      if (r.radius < ORB_RADIUS - GOOD_WINDOW - 12) autoMiss(i);
    } else {
      r.alpha -= dt * 2.8;
    }
  }
  rings = rings.filter(r => r.radius > 0 && r.alpha > 0);

  // Round management
  if (rings.length === 0 && !waitingForNext) {
    waitingForNext = true; waitTimer = 750;
    roundsPlayed++;
    if (roundsPlayed % ROUNDS_PER_LEVEL === 0) { diffLevel++; refreshUI(); }
  }
  if (waitingForNext) {
    waitTimer -= dt * 1000;
    if (waitTimer <= 0) { waitingForNext = false; spawnRound(); }
  }

  // Timers
  if (orbFlash > 0) orbFlash -= dt * 1000;
  if (feedbackTimer > 0) {
    feedbackTimer -= dt * 1000;
    if (feedbackTimer <= 0) document.getElementById('feedback').style.opacity = '0';
  }

  drawGame();
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
setActiveBg(getActiveBgIdx());
refreshUI();
spawnRound();

})();
</script>
